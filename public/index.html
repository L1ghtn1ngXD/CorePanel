<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CorePanel</title>

    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-container">
            <h1 class="brand">CorePanel</h1>

            <h2 id="form-title" class="form-title">
                Loading
            </h2>

            <form id="auth-form" class="auth-form" autocomplete="off">
                <label class="input-group">
                    <span>Username</span>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        minlength="3"
                        maxlength="32"
                        autocomplete="username"
                        required
                    >
                </label>

                <label class="input-group">
                    <span>Password</span>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="current-password"
                        required
                    >
                </label>

                <p id="message" class="message" aria-live="polite"></p>

                <button id="submit-button" type="submit">
                    Continue
                </button>
            </form>
        </section>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
